<!DOCTYPE html><html class="h-full" lang="de"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Neuer Mitarbeiter - Modal</title>
<!-- Tailwind CSS v3 with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              sidebar: '#002528',
              teal: '#1a4e5b',
              tealDark: '#133e49',
              tealLight: '#235968',
              accent: '#38b2ac',
              bgMain: '#eef2f5',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scrollbars-and-resets">
    /* Remove native select default appearance to ensure crisp custom chevron styling */
    select {
      background-image: none !important;
    }
    textarea {
      resize: none;
    }
  </style>
</head>
<body class="h-full bg-[#eef2f5] font-sans antialiased text-gray-800 overflow-hidden relative">
<!-- BEGIN: BlurredBackgroundDashboard -->
<!-- Underlying dashboard view (Sidebar + Mitarbeiter Management View) -->
<div aria-hidden="true" class="h-full w-full flex overflow-hidden filter blur-[2px] pointer-events-none select-none">
<!-- Sidebar -->
<aside class="w-64 bg-[#002528] text-teal-100 flex flex-col justify-between p-6 flex-shrink-0">
<div>
<!-- Logo / Brand Header -->
<div class="flex flex-col items-center justify-center my-6">
<div class="w-16 h-16 rounded-full bg-[#08383c] border border-teal-700/50 flex items-center justify-center text-teal-300 font-bold text-lg mb-3 shadow-inner">
            FL
          </div>
<span class="text-sm font-semibold tracking-wider text-teal-100/90 uppercase">FLYH DIGITAL</span>
</div>
<!-- Navigation Links -->
<nav class="mt-8 space-y-1">
<div class="flex items-center gap-3 px-4 py-3 rounded-lg text-teal-300/70 hover:text-white text-sm font-medium">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
            Kalender
          </div>
<div class="flex items-center gap-3 px-4 py-3 rounded-lg text-teal-300/70 hover:text-white text-sm font-medium">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
            Termine
          </div>
<!-- Active Nav Item -->
<div class="flex items-center gap-3 px-4 py-3 rounded-lg bg-[#00383d] text-white text-sm font-medium border-l-4 border-teal-400">
<svg class="w-5 h-5 text-teal-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
            Mitarbeiter
          </div>
<div class="flex items-center gap-3 px-4 py-3 rounded-lg text-teal-300/70 hover:text-white text-sm font-medium">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
            Sperren
          </div>
<div class="flex items-center gap-3 px-4 py-3 rounded-lg text-teal-300/70 hover:text-white text-sm font-medium">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
            Leistungen
          </div>
<div class="flex items-center gap-3 px-4 py-3 rounded-lg text-teal-300/70 hover:text-white text-sm font-medium">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
            Öffnungszeiten
          </div>
</nav>
</div>
<!-- Bottom Profile -->
<div class="flex items-center gap-3 pt-4 border-t border-teal-900/50">
<div class="w-10 h-10 rounded-full bg-teal-800 flex items-center justify-center text-teal-200 font-medium">
          M
        </div>
<div>
<p class="text-xs font-semibold text-white">Maurice</p>
<p class="text-[10px] text-teal-400">Salon Coiffeur</p>
</div>
</div>
</aside>
<!-- Main Content Area -->
<main class="flex-1 p-10 overflow-auto">
<div class="flex justify-between items-center mb-8">
<h1 class="text-2xl font-bold text-gray-900">Mitarbeiter</h1>
<button class="bg-[#1a4e5b] text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 shadow-sm">
<span class="">+</span> Mitarbeiter
        </button>
</div>
<!-- Background Cards Replica -->
<div class="grid grid-cols-2 gap-8 max-w-4xl">
<!-- Card 1 -->
<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center">
<div class="w-24 h-24 rounded-full bg-gray-300 mb-4 overflow-hidden">
<div class="w-full h-full bg-cover bg-center" style="background-image: url('data:image/svg+xml;utf8,&lt;svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' fill=\'%23a0aec0\'&gt;&lt;circle cx=\'50\' cy=\'40\' r=\'20\'/&gt;&lt;circle cx=\'50\' cy=\'95\' r=\'35\'/&gt;&lt;/svg&gt;');"></div>
</div>
<h3 class="font-semibold text-gray-800 text-lg">Jonas Weber</h3>
<span class="mt-2 text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium">Friseur</span>
<div class="w-full mt-6 pt-4 border-t border-gray-100 flex items-center justify-center text-xs text-gray-500">
            01.07.24 - 20.07.24
          </div>
</div>
<!-- Card 2 -->
<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center">
<div class="w-24 h-24 rounded-full bg-gray-300 mb-4 overflow-hidden">
<div class="w-full h-full bg-cover bg-center" style="background-image: url('data:image/svg+xml;utf8,&lt;svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' fill=\'%23a0aec0\'&gt;&lt;circle cx=\'50\' cy=\'40\' r=\'20\'/&gt;&lt;circle cx=\'50\' cy=\'95\' r=\'35\'/&gt;&lt;/svg&gt;');"></div>
</div>
<h3 class="font-semibold text-gray-800 text-lg">Tom Berger</h3>
<span class="mt-2 text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-medium">Stylist</span>
<div class="w-full mt-6 pt-4 border-t border-gray-100 flex items-center justify-center text-xs text-rose-500 font-medium">
            03.06.24 - 05.06.24
          </div>
</div>
</div>
</main>
</div>
<!-- END: BlurredBackgroundDashboard -->
<!-- BEGIN: ModalOverlay -->
<!-- Backdrop Layer -->
<div class="fixed inset-0 bg-[#0a1b24]/40 z-40 transition-opacity backdrop-blur-[1px] flex items-center justify-center p-4">
<!-- Modal Dialog Window -->
<div aria-labelledby="modal-title" aria-modal="true" class="bg-white rounded-2xl shadow-2xl w-full max-w-[512px] overflow-hidden transform transition-all border border-gray-100" data-purpose="employee-creation-modal" role="dialog">
<!-- BEGIN: ModalHeader -->
<div class="flex items-center justify-between pt-7 pb-4 px-8">
<h2 class="text-xl font-bold text-gray-900 tracking-tight" id="modal-title">
          Neuer Mitarbeiter
        </h2>
<!-- Close 'X' Button -->
<button aria-label="Modal schließen" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-gray-700 flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-700" type="button">
<svg class="w-4 h-4 stroke-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: ModalHeader -->
<!-- BEGIN: ModalForm -->
<form class="px-8 pt-2 pb-8 space-y-4">
<!-- Field: Name -->
<div class="flex items-center gap-4 pb-2" data-purpose="field-avatar-upload">
  <div class="relative flex-shrink-0">
    <div class="w-16 h-16 rounded-full bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400 overflow-hidden group">
      <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </div>
  </div>
  <div class="flex-1">
    <label class="block text-xs font-semibold text-[#1a4e5b] mb-1.5">Foto</label>
    <div class="flex items-center gap-3">
      <label class="cursor-pointer inline-flex items-center gap-2 px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-medium text-gray-800 shadow-sm hover:bg-gray-50 transition-colors focus-within:ring-2 focus-within:ring-[#1a4e5b]">
        <svg class="w-4 h-4 text-[#1a4e5b]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span class="">Foto hochladen</span>
        <input accept="image/png, image/jpeg" class="sr-only" name="avatar" type="file">
      </label>
      <span class="text-[10px] text-gray-400">PNG, JPG bis 5MB</span>
    </div>
  </div>
</div><div data-purpose="field-name">
<label class="block text-xs font-semibold text-[#1a4e5b] mb-1.5" for="employee-name">
            Name:
          </label>
<input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:border-[#1a4e5b] focus:ring-1 focus:ring-[#1a4e5b] outline-none shadow-sm transition-colors" id="employee-name" name="name" type="text" value="Jonas S.">
</div>
<!-- Field: Uhrzeit (Two inputs side-by-side) -->
<div data-purpose="field-time">
<label class="block text-xs font-semibold text-[#1a4e5b] mb-1.5">
            Uhrzeit
          </label>
<div class="grid grid-cols-2 gap-3.5">
<div>
<input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm text-gray-800 focus:border-[#1a4e5b] focus:ring-1 focus:ring-[#1a4e5b] outline-none shadow-sm transition-colors" id="time-start" name="time_start" type="text" value="09:00">
</div>
<div>
<input class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm text-gray-800 focus:border-[#1a4e5b] focus:ring-1 focus:ring-[#1a4e5b] outline-none shadow-sm transition-colors" id="time-end" name="time_end" type="text" value="10:00">
</div>
</div>
</div>
<!-- Field: Position -->
<div data-purpose="field-position">
<label class="block text-xs font-semibold text-[#1a4e5b] mb-1.5" for="employee-position">
            Postion
          </label>
<div class="relative">
<select class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-800 focus:border-[#1a4e5b] focus:ring-1 focus:ring-[#1a4e5b] outline-none shadow-sm appearance-none pr-10 cursor-pointer transition-colors" id="employee-position" name="position">
<option selected="" value="Stylist">Stylist</option>
<option value="Friseur">Friseur</option>
<option value="Meister">Meister</option>
<option value="Auszubildender">Auszubildender</option>
</select>
<!-- Chevron Down Icon -->
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- Field: Leistung -->
<div data-purpose="field-service">
<label class="block text-xs font-semibold text-[#1a4e5b] mb-1.5" for="employee-service">
            Leistung
          </label>
<div class="relative">
<select class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-800 focus:border-[#1a4e5b] focus:ring-1 focus:ring-[#1a4e5b] outline-none shadow-sm appearance-none pr-10 cursor-pointer transition-colors" id="employee-service" name="service">
<option selected="" value="Maschinen Schnitt">Maschinen Schnitt</option>
<option value="Herrenschnitt">Herrenschnitt</option>
<option value="Damenschnitt">Damenschnitt</option>
<option value="Bartpflege">Bartpflege</option>
<option value="Färben">Färben</option>
</select>
<!-- Chevron Down Icon -->
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- Field: Notizen -->
<div data-purpose="field-notes">
<label class="block text-xs font-semibold text-[#1a4e5b] mb-1.5" for="employee-notes">
            Notizen
          </label>
<textarea class="w-full rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:border-[#1a4e5b] focus:ring-1 focus:ring-[#1a4e5b] outline-none shadow-sm transition-colors" id="employee-notes" name="notes" placeholder="Optionale Notizen..." rows="3"></textarea>
</div>
<!-- BEGIN: ModalActions / Buttons -->
<div class="flex items-center justify-between pt-5 gap-4">
<!-- Cancel / Abbrechen Button -->
<button class="w-1/2 py-2.5 px-4 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-[#1a4e5b] hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1a4e5b] transition-colors text-center" type="button">
            Abbrechen
          </button>
<!-- Submit / Hinzufügen Button -->
<button class="w-1/2 py-2.5 px-4 bg-[#1a4e5b] hover:bg-[#133e49] border border-transparent rounded-lg text-sm font-semibold text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1a4e5b] transition-colors text-center" type="submit">
            Mitarbeiter Hinzufügen
          </button>
</div>
<!-- END: ModalActions -->
</form>
<!-- END: ModalForm -->
</div>
</div>
<!-- END: ModalOverlay -->


</body></html>
