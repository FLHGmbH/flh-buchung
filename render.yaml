services:
  - type: web
    name: flh-buchung
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_ORIGIN
        value: https://flh-buchung.onrender.com
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_TO
        value: m.schwacha@flh-mediadigital.de
      - key: DATABASE_URL
        fromDatabase:
          name: flh-buchung-db
          property: connectionString

databases:
  - name: flh-buchung-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
